services:
  # Applies pending database migrations (api/migrations/), then exits. The api and the cron
  # sidecar wait for it to succeed, so new code never starts against an unmigrated schema.
  # `docker compose up` replaces the running api before this finishes, so a failed migration
  # leaves the api stopped. To keep the current api serving if a migration fails, run this
  # step on its own first; see README.md "Deploying".
  migrate:
    build: ./api
    command: ["npm", "run", "migrate"]
    restart: "no"
    env_file:
      - .env
  api:
    build: ./api
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - ${BIOENERGY_ORG_API_LOCAL_PORT}:8080
    stdin_open: true
    tty: true
  api-cron-sidecar:
    build: ./api
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    command: ["sh", "scripts/start_cron.sh"]
    env_file:
    - .env
  client:
    depends_on:
      - api
    build:
      context: ./client
      args:
        VITE_BIOENERGY_ORG_API_URI: ${VITE_BIOENERGY_ORG_API_URI}
        VITE_TURNSTILE_SITEKEY: ${VITE_TURNSTILE_SITEKEY}
        VITE_RYBBIT_URL: ${VITE_RYBBIT_URL}
        VITE_RYBBIT_ID: ${VITE_RYBBIT_ID}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - ${BIOENERGY_ORG_CLIENT_LOCAL_PORT}:80
    volumes:
      - ./nginx_config:/etc/nginx/conf.d
    stdin_open: true
    tty: true
  mcp:
    depends_on:
      - api
    build: ./mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${BIOENERGY_ORG_MCP_LOCAL_PORT}
      API_BASE_URL: ${BIOENERGY_ORG_MCP_API_BASE_URL}
      API_TOKEN: ${BIOENERGY_ORG_MCP_API_TOKEN}
    ports:
      - ${BIOENERGY_ORG_MCP_LOCAL_PORT}:8081
